<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey - Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 24px;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        input[type="text"],
        input[type="password"] {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0284c7;
        }

        input[type="submit"] {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        input[type="submit"]:hover {
            background: #0369a1;
        }
        
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Accedi</h1>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="u">Username</label>
                <input type="text" id="u" name="u" placeholder="Inserisci lo username" required>
            </div>

            <div class="form-group">
                <label for="p">Password</label>
                <input type="password" id="p" name="p" placeholder="Inserisci la password" required>
            </div>

            <input type="submit" value="Accedi">
        </form>
    </div>

</body>
</html>
